<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="latency">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --after:#2a78d6; --before:#898781; --ref:#c3c2b7; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --after:#3987e5; --before:#898781; --ref:#6b6a64; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; }
  .label { fill: var(--ink); font-size: 13px; }
</style>
<rect width="720" height="360" fill="var(--surface)"/>
<text class="title" x="20" y="28">Half a second from packet to database, up to the 10,000 a second target</text>
<text class="sub" x="20" y="48">Receive to database commit, p99, on a log scale</text>
<line x1="72" x2="624" y1="304.0" y2="304.0" stroke="var(--grid)"/>
<text class="tick" x="64" y="308.0" text-anchor="end">0.1 s</text>
<line x1="72" x2="624" y1="216.2" y2="216.2" stroke="var(--grid)"/>
<text class="tick" x="64" y="220.2" text-anchor="end">1 s</text>
<line x1="72" x2="624" y1="128.4" y2="128.4" stroke="var(--grid)"/>
<text class="tick" x="64" y="132.4" text-anchor="end">10 s</text>
<line x1="72" x2="624" y1="84.0" y2="84.0" stroke="var(--grid)"/>
<text class="tick" x="64" y="88.0" text-anchor="end">32 s</text>
<line x1="72" x2="624" y1="304" y2="304" stroke="var(--axis)"/>
<text class="tick" x="90.4" y="322" text-anchor="middle">100</text>
<text class="tick" x="164.0" y="322" text-anchor="middle">500</text>
<text class="tick" x="256.0" y="322" text-anchor="middle">1,000</text>
<text class="tick" x="348.0" y="322" text-anchor="middle">1,500</text>
<text class="tick" x="440.0" y="322" text-anchor="middle">2,000</text>
<text class="tick" x="624.0" y="322" text-anchor="middle">3,000</text>
<text class="tick" x="348.0" y="350" text-anchor="middle">Drones (10 messages a second each)</text>
<polyline points="90.4,243.2 118.0,242.7 164.0,242.4 256.0,109.5" fill="none" stroke="var(--before)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90.4" cy="243.2" r="4" fill="var(--before)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="118.0" cy="242.7" r="4" fill="var(--before)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="164.0" cy="242.4" r="4" fill="var(--before)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="256.0" cy="109.5" r="4" fill="var(--before)" stroke="var(--surface)" stroke-width="2"/>
<text class="label" x="265.0" y="101.5">Before</text>
<polyline points="90.4,268.6 118.0,244.0 164.0,247.6 256.0,242.4 348.0,136.2 440.0,109.5 624.0,109.5" fill="none" stroke="var(--after)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90.4" cy="268.6" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="118.0" cy="244.0" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="164.0" cy="247.6" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="256.0" cy="242.4" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="348.0" cy="136.2" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="440.0" cy="109.5" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="624.0" cy="109.5" r="4" fill="var(--after)" stroke="var(--surface)" stroke-width="2"/>
<text class="label" x="633.0" y="113.5">After</text>
<text class="tick" x="532.0" y="97.5" text-anchor="middle">16 s is the top of the histogram: the true value is higher</text>
<rect x="20" y="60" width="12" height="4" rx="2" fill="var(--before)"/>
<text x="37" y="66" class="tick">Before</text>
<rect x="90" y="60" width="12" height="4" rx="2" fill="var(--after)"/>
<text x="107" y="66" class="tick">After</text>
</svg>

# Prometheus scrapes every Murmur service (guide step 2.9).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingester
    static_configs:
      - targets: ["ingester:9101"]
  - job_name: consumer
    static_configs:
      - targets: ["consumer:9102"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9103"]
  - job_name: commander
    static_configs:
      - targets: ["commander:9104"]
  - job_name: alerter
    static_configs:
      - targets: ["alerter:9105"]

# Settings for the Murmur chart (make k8s-up). The defaults suit the local
# kind cluster (deploy/k8s/kind.yaml); the passwords here are local defaults,
# like the ones in deploy/docker-compose.yml, and must be overridden anywhere
# else (helm --set or a values file kept out of git).

nats:
  image: nats:2.15.2-alpine
  # NATS servers, and so copies of the telemetry stream. 3 survives losing
  # one server, since 2 of 3 is still a majority; 1 for a single node. Each
  # server needs a node of its own.
  replicas: 3
  storage: 1Gi # JetStream files per server; the stream keeps 10 minutes
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

timescaledb:
  image: timescale/timescaledb:2.31.0-pg17
  storage: 2Gi
  user: murmur
  password: murmur
  database: murmur
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

redis:
  image: redis:8.10.3-alpine
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

# Murmur's own services. Images are murmur/<service>:<tag>, built and loaded
# into kind by make kind-up; IfNotPresent uses the loaded one.
image:
  repository: murmur
  tag: dev
  pullPolicy: IfNotPresent

ingester:
  # The node port drones send MAVLink to, on the edge node (UDP 14570 on the
  # host, via deploy/k8s/kind.yaml).
  nodePort: 30560
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }

consumer:
  replicas: 2 # they share one durable consumer, so each message goes to one
  batch: 500
  # With KEDA in the cluster, the replica count follows the stream's backlog
  # instead: lag (messages waiting plus delivered but unacknowledged) divided
  # by lagThreshold, between minReplicas and maxReplicas. Without KEDA, or
  # with enabled: false, replicas above applies.
  autoscaling:
    enabled: true
    minReplicas: 2 # two, so losing a node never leaves the stream unread
    maxReplicas: 6 # past this the database, not the consumer, is the limit
    lagThreshold: 1000 # messages of backlog per consumer
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }

gateway:
  replicas: 2 # any copy serves any browser: sessions are in Redis
  nodePort: 30080 # the map, http://localhost:8090 on the host
  user: demo
  password: murmur # the demo login; "" for no logins
  loginHint: "Demo login: demo / murmur" # "" for none
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

commander:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

alerter:
  lowBattery: 20
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

fakegen:
  enabled: true
  count: 10 # fake drones, 10 messages a second each
  resources:
    requests: { cpu: 25m, memory: 16Mi }
    limits: { memory: 64Mi }

{{- /*
Credentials. The services get them as environment variables from here, not
as plain text in their arguments, so `kubectl describe pod` does not show them.
*/ -}}
{{- $db := .Values.timescaledb }}
apiVersion: v1
kind: Secret
metadata:
  name: murmur-db
  labels:
    {{- include "murmur.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $db.user | quote }}
  POSTGRES_PASSWORD: {{ $db.password | quote }}
  POSTGRES_DB: {{ $db.database | quote }}
  # For the Murmur services' -db flag.
  DATABASE_URL: {{ printf "postgres://%s:%s@timescaledb:5432/%s" $db.user ($db.password | urlquery) $db.database | quote }}

{{- /*
The consumer: the service that scales out. Every copy pulls from the same
durable consumer (db-writer), so NATS gives each message to one of them, and
a message redelivered after a crash is dropped by the insert's ON CONFLICT.
Step 5 hands the replica count to KEDA, which follows the stream's backlog.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: consumer
  labels:
    {{- include "murmur.labels" . | nindent 4 }}
    app.kubernetes.io/name: consumer
spec:
  selector:
    app.kubernetes.io/name: consumer
  ports:
    - { name: metrics, port: 9102 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    {{- include "murmur.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.consumer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer
        {{- include "murmur.labels" . | nindent 8 }}
    spec:
      # Spread copies over the nodes where there is room, so losing one node
      # does not take every copy with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: consumer
      containers:
        - name: consumer
          {{- include "murmur.image" (list "consumer" .) | nindent 10 }}
          args:
            {{- include "murmur.natsArgs" . | nindent 12 }}
            - -db=$(DATABASE_URL)
            - -redis=redis:6379
            - -batch={{ .Values.consumer.batch }}
            - -metrics=:9102
            - -interval=30s
          env:
            {{- include "murmur.dbEnv" . | nindent 12 }}
          ports:
            - { name: metrics, containerPort: 9102 }
          {{- include "murmur.metricsProbe" . | nindent 10 }}
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
